name: STM32 Build & Validation

on:
  push:
    branches: [ "main", "develop", "v1" ]
  pull_request:
    branches: [ "main", "develop", "v1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Install ARM GCC toolchain
      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build clang-format cppcheck
      
      # 3. Verify toolchain installation
      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version
          clang-format --version
          cppcheck --version
      
      # 4. Code Linting - Check code style with clang-format
      - name: Lint code style
        run: |
          echo "=== Checking code style with clang-format ==="
          find Core/Src Core/Inc -name "*.c" -o -name "*.h" | while read file; do
            if ! clang-format --dry-run --Werror "$file" 2>&1 | grep -q .; then
              echo "✓ $file: OK"
            else
              echo "⚠ $file: Style issues found"
              clang-format --dry-run "$file"
            fi
          done
          echo ""
          echo "Note: Run 'clang-format -i <file>' locally to auto-fix formatting"
      
      # 5. Static Analysis - Check for potential bugs
      - name: Static Analysis with cppcheck
        run: |
          echo "=== Running static analysis ==="
          cppcheck --enable=all --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            Core/Src/ Core/Inc/ 2>&1 | tee cppcheck-report.txt
          echo ""
          echo "Static analysis complete (see report above)"
      
      # 6. Clean build directory
      - name: Clean build directory
        run: |
          rm -rf build/
      
      # 7. Configure CMake for Debug build
      - name: Configure CMake (Debug)
        run: |
          cmake --preset Debug
      
      # 8. Build the project
      - name: Build project
        run: |
          cmake --build build/Debug --config Debug --verbose
      
      # 9. Check for build errors and output
      - name: Verify build output
        run: |
          echo "=== Listing build directory ==="
          find build/Debug -type f \( -name "ePHC*" -o -name "*.elf" \) | head -20
          echo ""
          echo "=== Checking for executable ==="
          ls -lah build/Debug/ 2>/dev/null || echo "build/Debug directory not found"
          echo ""
          if [ -f build/Debug/ePHC.elf ]; then
            echo "✓ Build successful: ePHC.elf executable created"
            file build/Debug/ePHC.elf
            arm-none-eabi-objdump -h build/Debug/ePHC.elf | head -20
          else
            echo "✗ Build failed: ePHC.elf executable not found"
            exit 1
          fi
      
      # 10. Generate .bin file from .elf
      - name: Generate binary file
        run: |
          arm-none-eabi-objcopy -O binary build/Debug/ePHC.elf build/Debug/ePHC.bin
          ls -lh build/Debug/ePHC.*
      
      # 11. Upload artifacts for download
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ePHC-Firmware
          path: |
            build/Debug/ePHC.elf
            build/Debug/ePHC.bin
          retention-days: 30
          compression-level: 6
      
      # 12. Upload static analysis report
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Analysis-Reports
          path: |
            cppcheck-report.txt
          retention-days: 30
