name: STM32 Build & Validation

on:
  push:
    branches: [ "main", "develop", "v1" ]
  pull_request:
    branches: [ "main", "develop", "v1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Install ARM GCC toolchain
      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build
      
      # 3. Verify toolchain installation
      - name: Verify toolchain
        run: |
          arm-none-eabi-gcc --version
          cmake --version
          ninja --version
      
      # 4. Clean build directory
      - name: Clean build directory
        run: |
          rm -rf build/
      
      # 5. Configure CMake for Debug build
      - name: Configure CMake (Debug)
        run: |
          cmake --preset Debug
      
      # 6. Build the project
      - name: Build project
        run: |
          cmake --build build/Debug --config Debug --verbose
      
      # 7. Check for build errors and output
      - name: Verify build output
        run: |
          echo "=== Listing build directory ==="
          find build/Debug -type f \( -name "ePHC*" -o -name "*.elf" \) | head -20
          echo ""
          echo "=== Checking for executable ==="
          ls -lah build/Debug/ 2>/dev/null || echo "build/Debug directory not found"
          echo ""
          if [ -f build/Debug/ePHC.elf ]; then
            echo "✓ Build successful: ePHC.elf executable created"
            file build/Debug/ePHC.elf
            arm-none-eabi-objdump -h build/Debug/ePHC.elf | head -20
          else
            echo "✗ Build failed: ePHC.elf executable not found"
            exit 1
          fi
